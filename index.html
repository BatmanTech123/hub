<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a1d20">
<title>Matt's Hub</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700&family=Atkinson+Hyperlegible+Mono:wght@400;600&display=swap">
<style>
/* ADHD-friendly theme: calm base, one loud signal (the accent), big targets, readable type.
   1 One Thing home · 2 Visible time · 3 Instant wins · 4 If-then wrap-up · 5 Calm base, loud signal */
:root{
  --bg:#1a1d20; --deep:#15181b; --panel:#23272b; --panel2:#2e3338; --sunk:#1d2024;
  --ink:#e9e7e1; --ink2:#c9ccc9; --muted:#9aa0a4; --line:#30353a; --line2:#3a4046; --box:#4a5056;
  --accent:#f2c230; --accent-ink:#1a1500; --done:#5f8f6e; --late:#e9a58e; --bar:#6d757c; --bar2:#8d959b; --track:#2c3136;
  --sans:"Atkinson Hyperlegible Next","Segoe UI",system-ui,Roboto,sans-serif;
  --mono:"Atkinson Hyperlegible Mono",ui-monospace,"Roboto Mono",monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root{
  --bg:#f3f2ee; --deep:#eceae5; --panel:#ffffff; --panel2:#ebeae5; --sunk:#f6f5f2;
  --ink:#1b1d1f; --ink2:#44484c; --muted:#6b7075; --line:#dcdbd4; --line2:#c9c8c1; --box:#a9aca9;
  --accent:#e0ad00; --accent-ink:#1a1500; --done:#3f7a52; --late:#b0452f; --bar:#8b9096; --bar2:#8b9096; --track:#e2e1dc; color-scheme:light}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 var(--sans);-webkit-tap-highlight-color:transparent}
body.focusing{background:var(--deep)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--ink)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.mono{font-family:var(--mono)}
.daybar{position:sticky;top:0;z-index:3;height:6px;background:var(--track)}
.daybar div{height:100%;background:var(--bar)}
.wrap{max-width:560px;margin:0 auto;padding:10px 20px calc(env(safe-area-inset-bottom,0px) + 110px)}
.clock{display:flex;justify-content:space-between;font:13px var(--mono);color:var(--muted);padding-top:calc(env(safe-area-inset-top,0px))}
header{display:flex;align-items:center;gap:10px;margin:14px 0 16px}
header h1{font-size:22px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line2);background:var(--panel);display:grid;place-items:center;flex:none;color:var(--ink)}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.banner{background:var(--panel2);border-radius:12px;padding:10px 12px;font-size:15px;margin-bottom:14px;color:var(--ink2)}
.label{font:600 12px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
/* Now card: the one loud thing */
.now{border:2px solid var(--accent);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px;background:var(--panel)}
.now .big{font-size:25px;line-height:1.25;font-weight:700;overflow-wrap:anywhere}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:13px var(--mono);padding:4px 10px;border-radius:999px;background:var(--panel2);color:var(--ink2)}
.ifthen{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:12px;background:var(--sunk);color:var(--ink2);font-size:16px;line-height:1.4}
.ifthen svg{margin-top:2px;color:var(--muted)}
.leftoff{font-size:14px;color:var(--muted);line-height:1.4}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{min-height:50px;padding:0 18px;border-radius:14px;border:1px solid var(--line2);background:transparent;font-size:16px;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border:0;font-weight:700;font-size:18px;min-height:54px}
.btn.grow{flex:1}
.btn.danger{color:var(--late)}
.btn.small{min-height:40px;font-size:15px;padding:0 14px}
.wins{display:flex;align-items:center;gap:10px;padding:0 4px;background:none;border:0;color:var(--ink2);font-size:16px;min-height:44px;text-align:left}
.dots{display:flex;gap:6px}
.dot{width:22px;height:22px;border-radius:7px;border:2px dashed var(--box)}
.dot.on{background:var(--done);border:0;display:grid;place-items:center}
.dot.on::after,.ck.on::after{content:"";width:9px;height:5px;border-left:2.6px solid var(--bg);border-bottom:2.6px solid var(--bg);transform:rotate(-45deg) translate(1px,-1px)}
.navrow{text-decoration:none;display:flex;align-items:center;gap:12px;min-height:56px;padding:0 16px;border-radius:14px;background:var(--panel);border:1px solid var(--line);width:100%;text-align:left;color:var(--ink)}
.navrow .n{flex:1;font-size:17px}
.navrow .m{font:13px var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55%}
.navrow svg{color:var(--muted)}
/* due cards with shrinking time bars */
.due{display:flex;flex-direction:column;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px 14px 8px}
.due.first{border:2px solid var(--accent)}
.due .top{display:flex;gap:6px;align-items:flex-start}
.due .t{flex:1;font-size:18px;line-height:1.3;padding-top:9px;overflow-wrap:anywhere}
.due.first .t{font-weight:600}
.due .left{font:600 14px var(--mono);color:var(--ink2);white-space:nowrap;padding-top:11px;display:flex;align-items:center;gap:6px}
.due.first .left{color:var(--accent)}
.due.late .left{color:var(--late)}
.due .bar,.due .sub{margin-left:52px}
.bar{height:10px;border-radius:6px;background:var(--panel2);display:flex}
.bar div{border-radius:6px;background:var(--bar2)}
.due.first .bar div{background:var(--accent)}
.due.late .bar{border:1px dashed var(--late)}
.sub{font:13px var(--mono);color:var(--muted)}
.later{display:flex;justify-content:space-between;gap:12px;font-size:16px;color:var(--ink2);padding:4px 0}
.later span:last-child{font:14px var(--mono);white-space:nowrap}
/* items */
.items{display:grid;gap:8px}
.item{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 8px 8px 4px;display:grid;grid-template-columns:48px 1fr 44px;gap:2px;align-items:start}
.item.done .t{text-decoration:line-through;color:var(--muted)}
.check{width:48px;height:48px;border:0;background:none;display:grid;place-items:center;flex:none}
.ck{width:24px;height:24px;border-radius:7px;border:2px solid var(--ink2);display:grid;place-items:center}
.ck.on{background:var(--done);border-color:var(--done)}
.item .t{overflow-wrap:anywhere;padding-top:11px}
.im{font:13px var(--mono);color:var(--muted);margin-top:4px;display:flex;gap:8px;flex-wrap:wrap}
.im .late{color:var(--late)}
.more{width:44px;height:44px;border:0;background:none;color:var(--muted);font-size:22px;line-height:1}
.edit{grid-column:1/-1;display:grid;gap:10px;padding:8px 6px 4px}
.field,.edit input,.edit select,.edit textarea{width:100%;min-height:50px;border-radius:12px;border:1px solid var(--line2);background:var(--sunk);padding:10px 12px;font-size:16px;color:var(--ink)}
textarea.field{resize:none;line-height:1.4}
.empty{color:var(--muted);font-size:16px;padding:16px;border:1px dashed var(--line2);border-radius:14px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;min-height:80px;display:grid;align-content:space-between;color:var(--ink)}
.tile .n{font-weight:600}
.tile .c{font:600 22px var(--mono)}
.tile .c small{font:13px var(--mono);color:var(--muted);margin-left:4px}
.tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none}
.tabs button,.pick{flex:none;min-height:40px;border-radius:999px;border:1px solid var(--line2);background:transparent;padding:0 14px;font-size:15px;color:var(--ink2)}
.tabs button[aria-pressed="true"],.pick[aria-pressed="true"]{background:var(--panel2);border-color:var(--ink2);color:var(--ink)}
/* focus */
.focus{min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:26px;padding:calc(env(safe-area-inset-top,0px) + 48px) 28px calc(env(safe-area-inset-bottom,0px) + 32px);max-width:480px;margin:0 auto}
.focus .task{font-size:24px;line-height:1.3;font-weight:700;text-align:center;overflow-wrap:anywhere}
.ring{width:260px;height:260px;border-radius:50%;display:grid;place-items:center}
.ring .in{width:220px;height:220px;border-radius:50%;background:var(--deep);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.ring .tm{font:600 52px var(--mono)}
.focus .note{font-size:16px;color:var(--muted);text-align:center;line-height:1.4}
.focus .acts{display:flex;flex-direction:column;gap:10px;width:100%;margin-top:auto}
/* win */
.winhead{border-radius:20px;background:var(--panel);padding:24px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.bigcheck{width:72px;height:72px;border-radius:50%;background:var(--done);display:grid;place-items:center}
.bigcheck::after{content:"";width:30px;height:15px;border-left:5px solid var(--bg);border-bottom:5px solid var(--bg);transform:rotate(-45deg) translate(2px,-3px)}
.pills{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.pills span{width:26px;height:8px;border-radius:4px;background:var(--done)}
.step{display:flex;align-items:center;gap:6px;min-height:48px;width:100%;border:0;background:none;text-align:left;color:var(--ink2);font-size:16px;padding:0;border-radius:10px}
.step.isdone{color:var(--muted)}
.step.isdone .tx{text-decoration:line-through}
.step.next{border:2px solid var(--accent);padding-right:10px;color:var(--ink);font-weight:600}
.step .tx{flex:1}
.step .tag{font:12px var(--mono);color:var(--accent)}
.receipt{display:flex;justify-content:space-between;gap:12px;font-size:15px;color:var(--ink2);padding:3px 0}
.receipt span:last-child{font:13px var(--mono);white-space:nowrap}
/* wrap-up form */
.lbl{font-size:15px;color:var(--ink2);display:block;margin-bottom:6px}
.lbl.k{font:13px var(--mono);letter-spacing:.06em;color:var(--muted)}
/* capture bar */
.capture{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--track);padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 14px);z-index:4}
.capture form{max-width:560px;margin:0 auto;display:flex;gap:10px}
.capture input{flex:1;min-width:0;min-height:54px;border-radius:14px;border:1px solid var(--line2);background:var(--panel);padding:0 16px;font-size:17px;color:var(--ink)}
.capture button{width:58px;min-height:54px;border-radius:14px;border:0;background:var(--ink);color:var(--bg);display:grid;place-items:center}
.hint{max-width:560px;margin:6px auto 0;font:12px var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 124px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:16px;z-index:6;max-width:90vw}
.signin{min-height:100vh;display:grid;place-items:center;padding:24px}
.signin .card{max-width:360px;width:100%;display:grid;gap:14px;text-align:center;padding:28px 22px}
.signin h1{margin:0;font-size:26px}
.kv{display:grid;gap:4px;font-size:15px}
.kv code{font:13px var(--mono);background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:8px;overflow-wrap:anywhere;user-select:all}
@media (prefers-reduced-motion:no-preference){.btn,.item,.tile,.navrow{transition:background .15s,border-color .15s}}
</style>
</head>
<body>
<div id="signinView" class="signin" hidden>
  <div class="card">
    <h1>Matt's Hub</h1>
    <p style="margin:0;color:var(--ink2)">One next thing, everything else in its place.</p>
    <button class="btn primary" id="signinBtn">Sign in with Google</button>
    <p id="signinMsg" style="margin:0;font-size:14px;color:var(--muted)"></p>
  </div>
</div>

<div id="appView" hidden>
  <div class="daybar" id="daybar" aria-hidden="true"><div id="dayfill"></div></div>
  <div class="wrap" id="wrap">
    <div class="clock" id="clock"><span id="clockNow"></span><span id="clockLeft"></span></div>
    <header>
      <button class="iconbtn" id="backBtn" aria-label="Back" hidden><svg class="i" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
      <h1 id="title">Matt's Hub</h1>
      <button class="iconbtn" id="searchBtn" aria-label="Search"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
      <button class="iconbtn" id="settingsBtn" aria-label="Settings"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></button>
    </header>
    <div id="banner" class="banner" hidden></div>
    <main id="main"></main>
  </div>
  <main id="focusMain" hidden></main>
  <div class="capture" id="capture">
    <form id="captureForm" autocomplete="off">
      <input id="captureInput" type="text" placeholder="Oh, I have an idea…" aria-label="Capture an idea or item" enterkeyhint="done">
      <button type="submit" aria-label="Save"><svg class="i" viewBox="0 0 24 24" style="width:24px;height:24px;stroke-width:2.6"><path d="M12 5v14M5 12h14"/></svg></button>
    </form>
    <div class="hint">#buy #read #vinyl #car #school · !fri !10/21 · @project</div>
  </div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script type="module">
import { FIREBASE_CONFIG, LINKS } from "./config.js";

const LISTS = [
  { k:"inbox", n:"Ideas Inbox", tags:["idea","inbox"] },
  { k:"school", n:"School", tags:["school","class"] },
  { k:"buy", n:"To Buy", tags:["buy"] },
  { k:"reading", n:"Reading", tags:["read","reading","book"] },
  { k:"vinyl", n:"Vinyl wants", tags:["vinyl","record"] },
  { k:"car", n:"Car search", tags:["car"] },
  { k:"projects", n:"Projects", tags:["proj","project"] }
];
const WHEN_CHIPS = ["I finish dinner", "I pour my Saturday coffee", "I sit down before class", "I start my lunch break"];
const DEMO = !FIREBASE_CONFIG.apiKey || FIREBASE_CONFIG.apiKey.startsWith("PASTE");
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const svg = (paths, extra = "") => { const s = document.createElementNS("http://www.w3.org/2000/svg","svg"); s.setAttribute("viewBox","0 0 24 24"); s.setAttribute("class","i"); s.setAttribute("aria-hidden","true"); if (extra) s.setAttribute("style", extra); s.innerHTML = paths; return s; };
const ICON = { chev:'<path d="M9 6l6 6-6 6"/>', arrow:'<path d="M5 12h14"/><path d="M13 6l6 6-6 6"/>', timer:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2"/><path d="M9 2h6"/>', check:'<path d="M5 12l5 5 9-10"/>', alert:'<path d="M12 8v5"/><path d="M12 17h.01"/><circle cx="12" cy="12" r="9"/>' };

/* ---------- dates and time ---------- */
const pad = n => String(n).padStart(2,"0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayISO = () => iso(new Date());
function addDays(n){ const d = new Date(); d.setDate(d.getDate()+n); return iso(d); }
const startOfToday = () => { const d = new Date(); d.setHours(0,0,0,0); return d.getTime(); };
const dateOf = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const dayDiff = s => Math.round((dateOf(s) - dateOf(todayISO())) / 864e5);
const clockTime = t => new Date(t).toLocaleTimeString(undefined, { hour:"numeric", minute:"2-digit" }).toLowerCase();
function parseDue(tok){
  const t = tok.toLowerCase(), now = new Date();
  if (t === "today") return todayISO();
  if (t === "tom" || t === "tomorrow") return addDays(1);
  const days = ["sun","mon","tue","wed","thu","fri","sat"], i = days.indexOf(t.slice(0,3));
  if (i >= 0 && /^[a-z]+$/.test(t)) { let diff = (i - now.getDay() + 7) % 7; if (diff === 0) diff = 7; return addDays(diff); }
  let m = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if (m) return `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;
  m = t.match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?$/);
  if (m) {
    let y = m[3] ? (m[3].length === 2 ? 2000 + +m[3] : +m[3]) : now.getFullYear();
    let d = `${y}-${pad(+m[1])}-${pad(+m[2])}`;
    if (!m[3] && d < todayISO()) d = `${y+1}-${pad(+m[1])}-${pad(+m[2])}`;
    return d;
  }
  return null;
}
function fmtDue(d){
  if (!d) return "";
  if (d === todayISO()) return "today"; if (d === addDays(1)) return "tomorrow";
  return dateOf(d).toLocaleDateString(undefined, { weekday:"short", month:"short", day:"numeric" });
}
// Time left until the end of the due day, in words people can feel.
function timeLeft(d){
  const ms = dateOf(d).getTime() + 864e5 - Date.now();
  if (ms <= 0) { const n = -dayDiff(d); return { late:true, txt: n <= 0 ? "Overdue" : `Overdue ${n} day${n > 1 ? "s" : ""}`, frac:0 }; }
  const h = ms / 36e5, n = dayDiff(d);
  const txt = n === 0 ? `${Math.max(1, Math.floor(h))} h left` : `${n} day${n > 1 ? "s" : ""} left`;
  return { late:false, txt, frac: Math.min(1, ms / (7 * 864e5)) };
}
function inWords(d){ const n = dayDiff(d); if (n < 14) return `in ${n} days`; return `in ${Math.round(n/7)} weeks`; }

/* ---------- capture parsing ---------- */
function parseCapture(raw){
  const out = { list:"inbox", tags:[], due:null, project:null };
  const words = raw.trim().split(/\s+/), keep = [];
  for (const w of words) {
    if (/^#\w+/.test(w)) {
      const tag = w.slice(1).toLowerCase(); const L = LISTS.find(l => l.tags.includes(tag));
      if (L) out.list = L.k; else out.tags.push(tag);
      if (L && L.k === "inbox") out.tags.push("idea");
    } else if (/^!\S+/.test(w) && parseDue(w.slice(1))) out.due = parseDue(w.slice(1));
    else if (/^@\w+/.test(w)) out.project = w.slice(1).toLowerCase();
    else keep.push(w);
  }
  out.text = keep.join(" ");
  return out;
}

/* ---------- stores ---------- */
function makeLocalStore(){
  const KEY = "hub-demo-v1"; let state = { items:[], now:null };
  try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s) state = s; } catch(e) {}
  const subs = [];
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e) {} subs.forEach(f => f(state)); };
  return {
    uid: "demo",
    subscribe(f){ subs.push(f); f(state); },
    async add(it){ state.items.unshift({ id: crypto.randomUUID(), ...it }); save(); },
    async update(id, p){ state.items = state.items.map(x => x.id === id ? { ...x, ...p } : x); save(); },
    async remove(id){ state.items = state.items.filter(x => x.id !== id); save(); },
    async setNow(n){ state.now = n; save(); }
  };
}
async function makeFirebaseStore(){
  const V = "10.12.2";
  const { initializeApp } = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
  const A = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`);
  const F = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
  const app = initializeApp(FIREBASE_CONFIG);
  const auth = A.getAuth(app);
  const db = F.initializeFirestore(app, { localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) });
  return { A, F, auth, db };
}
function firebaseStoreFor(fb, uid){
  const { F, db } = fb; const items = F.collection(db, "users", uid, "items"); const nowRef = F.doc(db, "users", uid, "meta", "now");
  let state = { items:[], now:null }; const subs = [];
  const emit = () => subs.forEach(f => f(state));
  const onErr = e => { if (e && e.code === "permission-denied") showSetup(uid); else toast("Sync problem: " + (e && e.message || "try again")); };
  F.onSnapshot(F.query(items, F.orderBy("created","desc")), s => { state = { ...state, items: s.docs.map(d => ({ id:d.id, ...d.data() })) }; emit(); }, onErr);
  F.onSnapshot(nowRef, s => { state = { ...state, now: s.exists() ? s.data() : null }; emit(); }, onErr);
  return {
    uid,
    subscribe(f){ subs.push(f); f(state); },
    add: it => F.addDoc(items, it).catch(onErr),
    update: (id, p) => F.updateDoc(F.doc(items, id), p).catch(onErr),
    remove: id => F.deleteDoc(F.doc(items, id)).catch(onErr),
    setNow: n => F.setDoc(nowRef, n).catch(onErr)
  };
}

/* ---------- now, wins and the focus timer ---------- */
const NOW = () => S.now || {};
const patchNow = p => store.setNow({ ...NOW(), ...p, updated: Date.now() });
const pruneWins = w => (w || []).filter(x => x.at > Date.now() - 3 * 864e5);
function currentStep(){ const st = NOW().steps || []; const i = st.findIndex(s => !s.done); return i < 0 ? null : { i, n: st.length, text: st[i].text }; }
function currentText(){ const c = currentStep(); return c ? c.text : (NOW().next || ""); }
function receipts(){
  const t0 = startOfToday();
  const a = S.items.filter(i => i.status === "done" && i.doneAt >= t0).map(i => ({ text:i.text, at:i.doneAt }));
  const b = pruneWins(NOW().wins).filter(w => w.at >= t0).map(w => ({ text:w.text, at:w.at }));
  return a.concat(b).sort((x,y) => y.at - x.at);
}
let timer = null;
try { timer = JSON.parse(localStorage.getItem("hub-timer") || "null"); } catch(e) {}
const saveTimer = () => { try { timer ? localStorage.setItem("hub-timer", JSON.stringify(timer)) : localStorage.removeItem("hub-timer"); } catch(e) {} };
const tLeft = () => !timer ? 0 : timer.endAt ? Math.max(0, timer.endAt - Date.now()) : timer.left;
const mmss = ms => { const s = Math.ceil(ms / 1000); return `${Math.floor(s/60)}:${pad(s % 60)}`; };
function startTimer(mins){ timer = { label: currentText() || "Free focus", total: mins * 6e4, endAt: Date.now() + mins * 6e4, left: null, buzzed: false }; saveTimer(); go("focus"); }
function togglePause(){ if (!timer) return; if (timer.endAt) { timer.left = tLeft(); timer.endAt = null; } else { timer.endAt = Date.now() + timer.left; timer.left = null; } saveTimer(); render(); }
function addFive(){ if (!timer) return; const l = tLeft() + 5 * 6e4; timer.total = Math.max(timer.total, l); timer.endAt = Date.now() + l; timer.left = null; timer.buzzed = false; saveTimer(); render(); }

async function completeCurrent(){
  const n = NOW(), mins = timer ? Math.max(1, Math.round((timer.total - tLeft()) / 6e4)) : null;
  const steps = (n.steps || []).map(s => ({ ...s })); const i = steps.findIndex(s => !s.done);
  let text;
  if (i >= 0) { text = steps[i].text; steps[i].done = true; steps[i].at = Date.now(); }
  else text = n.next || (timer && timer.label) || "Focus session";
  const snapshot = steps.slice();
  const patch = { wins: pruneWins(n.wins).concat([{ text, at: Date.now(), mins }]), steps };
  if (!steps.some(s => !s.done)) Object.assign(patch, { steps: [], next: "", when: "", will: "", mins: null, lastDone: text });
  timer = null; saveTimer();
  await patchNow(patch);
  go("win", { text, mins, steps: snapshot, project: n.project || "" });
}

/* ---------- clock: day bar, time left, focus ring ---------- */
function tick(){
  const now = new Date(), t0 = startOfToday();
  const frac = Math.min(1, Math.max(0, (now - t0 - 6 * 36e5) / (18 * 36e5)));
  $("dayfill").style.width = (frac * 100).toFixed(1) + "%";
  $("daybar").setAttribute("aria-label", `${Math.round(frac * 100)} percent of the day gone`);
  const left = t0 + 864e5 - now, h = Math.floor(left / 36e5), m = Math.floor(left % 36e5 / 6e4);
  $("clockNow").textContent = now.toLocaleDateString(undefined, { weekday:"short", month:"short", day:"numeric" }) + " · " + clockTime(now);
  $("clockLeft").textContent = `${h ? h + " h " : ""}${m} min left today`;
  if (timer) {
    const l = tLeft();
    const r = $("ringFill"), tm = $("ringTime"), hp = $("homeTimer");
    if (r) r.style.background = `conic-gradient(var(--accent) 0deg ${(l / timer.total * 360).toFixed(1)}deg, var(--track) 0deg 360deg)`;
    if (tm) tm.textContent = l ? mmss(l) : "0:00";
    if (hp) hp.textContent = timer.endAt ? `${mmss(l)} left` : "Paused";
    if (l === 0 && !timer.buzzed) {
      timer.buzzed = true; saveTimer();
      try { navigator.vibrate && navigator.vibrate([500, 250, 500, 250, 500]); } catch(e) {}
      if (view.name === "focus") render();
    }
  }
}

  const body = el("div"); body.append(el("div","t", i.text));
  const meta = el("div","im");
  if (i.due) { const late = i.due < todayISO() && i.status !== "done"; meta.append(el("span", late ? "late" : null, (late ? "overdue · " : "due ") + fmtDue(i.due))); }
  if (showList) meta.append(el("span",null, LISTS.find(l => l.k === i.list)?.n || i.list));
  if (i.project) meta.append(el("span",null,"@" + i.project));
  (i.tags || []).filter(t => t !== "idea").forEach(t => meta.append(el("span",null,"#" + t)));
  if (meta.childNodes.length) body.append(meta);
  const more = el("button","more","⋯"); more.setAttribute("aria-label","Edit"); more.onclick = () => { openEdit = openEdit === i.id ? null : i.id; confirmDel = null; render(); };
  row.append(ck, body, more);
  if (openEdit === i.id) row.append(editPanel(i));
  return row;
}
function editPanel(i){
  const f = el("form","edit");
  const t = el("textarea"); t.rows = 2; t.value = i.text; t.id = "edit_text_" + i.id;
  const sel = el("select"); sel.id = "edit_list_" + i.id; LISTS.forEach(L => { const o = el("option",null,L.n); o.value = L.k; if (L.k === i.list) o.selected = true; sel.append(o); });
  const d = el("input"); d.type = "date"; d.value = i.due || ""; d.id = "edit_due_" + i.id;
  const r = el("div","row"); const sv = el("button","btn primary small","Save"); sv.type = "submit";
  const nw = el("button","btn small","Make it Now"); nw.type = "button"; nw.onclick = async () => { await patchNow({ next: i.text, steps: [], when: "", will: "", mins: null }); openEdit = null; go("home"); };
  const del = el("button","btn danger small", confirmDel === i.id ? "Tap again to delete" : "Delete"); del.type = "button";
  del.onclick = async () => { if (confirmDel === i.id) { await store.remove(i.id); openEdit = null; confirmDel = null; toast("Deleted"); render(); } else { confirmDel = i.id; render(); } };
  r.append(sv, nw, del); f.append(t, sel, d, r);
  f.onsubmit = async e => { e.preventDefault(); await store.update(i.id, { text:t.value.trim() || i.text, list:sel.value, due:d.value || null }); openEdit = null; toast("Saved"); render(); };
  return f;
}
let listFilter = "open";
function renderList(main, k){
  k = k || view.param;
  const tabs = el("div","tabs");
  [["open","Open"],["done","Done"],["all","All"]].forEach(([v,n]) => { const b = el("button",null,n); b.setAttribute("aria-pressed", listFilter === v); b.onclick = () => { listFilter = v; render(); }; tabs.append(b); });
  main.append(tabs);
  let items = S.items.filter(i => i.list === k);
  if (listFilter === "open") items = items.filter(i => i.status !== "done"); else if (listFilter === "done") items = items.filter(i => i.status === "done");
  items.sort((a,b) => (a.due || "9999").localeCompare(b.due || "9999") || b.created - a.created);
  const box = el("div","items");
  if (!items.length) box.append(el("div","empty", k === "inbox" ? "Inbox is empty. Type an idea below; it waits here until the monthly review." : "Nothing here yet. Type below to add to this list."));
  items.forEach(i => box.append(itemRow(i, false)));
  main.append(box);
}
let searchQ = "";
function renderSearch(main){
  const q = el("input","field"); q.type = "search"; q.id = "searchInput"; q.placeholder = "Search everything"; q.value = searchQ; q.setAttribute("aria-label","Search");
  main.append(q); const box = el("div","items"); box.style.marginTop = "12px"; main.append(box);
  const run = () => {
    searchQ = q.value; box.replaceChildren();
    const items = S.items.filter(i => searchQ && (i.text + " " + (i.tags || []).join(" ") + " " + (i.project || "")).toLowerCase().includes(searchQ.toLowerCase()));
    if (!items.length) box.append(el("div","empty", searchQ ? "No matches." : "Type to search ideas, lists, tags and projects."));
    items.slice(0,100).forEach(i => box.append(itemRow(i, true)));
  };
  q.oninput = run; run(); setTimeout(() => q.focus(), 50);
}
function renderSettings(main){
  const c = el("div","card"); c.style.display = "grid"; c.style.gap = "14px";
  if (setupUid) { const b = el("div","banner"); b.textContent = "Almost done: your data is locked until you paste this User ID into your Firestore rules and click Publish (setup step 6)."; c.append(b); }
  const kv = el("div","kv"); kv.append(el("strong",null,"Your User ID")); kv.append(el("code",null, store ? store.uid : "none")); c.append(kv);
  const total = S.items.length, open = S.items.filter(i => i.status !== "done").length;
  c.append(el("div",null, `${total} items saved, ${open} open.${DEMO ? " Demo mode: data stays on this device." : ""}`));
  const r = el("div","row");
  const ex = el("button","btn small","Export backup"); ex.onclick = exportBackup;
  const imLbl = el("label","btn small"); imLbl.textContent = "Import file";
  const im = el("input"); im.type = "file"; im.accept = "application/json"; im.hidden = true; im.id = "importFile"; im.onchange = e => importFile(e.target.files[0]); imLbl.append(im);
  r.append(ex, imLbl);
  if (!DEMO) { const so = el("button","btn danger small","Sign out"); so.onclick = () => fb.A.signOut(fb.auth); r.append(so); }
  c.append(r);
  c.append(el("div",null,"Capture shortcuts: #buy #read #vinyl #car #school #idea send to a list. !today !tom !fri !10/21 set a due date. @thesis tags a project."));
  c.lastChild.style.cssText = "font-size:15px;color:var(--ink2)";
  main.append(c);
}
function exportBackup(){
  const blob = new Blob([JSON.stringify({ exported:new Date().toISOString(), now:S.now, items:S.items }, null, 2)], { type:"application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `hub-backup-${todayISO()}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
async function importFile(file){
  if (!file) return;
  try {
    const data = JSON.parse(await file.text()); const seen = new Set(S.items.map(i => i.list + "|" + i.text)); let n = 0;
    for (const it of (data.items || [])) {
      if (!it.text || seen.has((it.list || "inbox") + "|" + it.text)) continue;
      await store.add({ text:it.text, list:LISTS.some(l => l.k === it.list) ? it.list : "inbox", tags:it.tags || [], due:it.due || null, project:it.project || null, status:it.status === "done" ? "done" : "open", created:it.created || Date.now() }); n++;
    }
    if (data.now && !S.now) await store.setNow({ ...data.now, updated:Date.now() });
    toast(`Imported ${n} items`);
  } catch(e) { toast("That file is not a hub backup or starter file"); }
}

/* ---------- boot ---------- */
let fb = null;
function startApp(s){
  store = s; $("signinView").hidden = true; $("appView").hidden = false;
  if (timer) view = { name:"focus" };
  store.subscribe(st => { S = st; if (!busy()) render(); });
  history.replaceState(view, ""); render();
}
async function boot(){
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(() => {});
  if (DEMO) { $("banner").hidden = false; $("banner").textContent = "Demo mode: data stays on this device until you paste your Firebase config into config.js."; startApp(makeLocalStore()); return; }
  try { fb = await makeFirebaseStore(); }
  catch(e) { $("signinView").hidden = false; $("signinMsg").textContent = "Could not load Firebase. Check your connection and config.js."; return; }
  fb.A.getRedirectResult(fb.auth).catch(() => {});
  $("signinBtn").onclick = async () => {
    const p = new fb.A.GoogleAuthProvider();
    try { await fb.A.signInWithPopup(fb.auth, p); }
    catch(e) { if (["auth/popup-blocked","auth/operation-not-supported-in-this-environment","auth/cancelled-popup-request"].includes(e.code)) fb.A.signInWithRedirect(fb.auth, p); else $("signinMsg").textContent = "Sign-in failed: " + (e.code || e.message); }
  };
  fb.A.onAuthStateChanged(fb.auth, u => {
    if (u) startApp(firebaseStoreFor(fb, u.uid));
    else { $("appView").hidden = true; $("signinView").hidden = false; }
  });
}
boot();
</script>
